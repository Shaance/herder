[package]
name = "herder"
version = "0.2.0"
edition = "2024"
description = "Dispatch, track and verify agent workers (Claude, Vibe, Codex) from any coordinating agent"
repository = "https://github.com/Shaance/herder"
readme = "README.md"
exclude = ["/.github", "/docs/assets"]
license = "MIT OR Apache-2.0"
authors = ["Christophe Ha"]
rust-version = "1.89"
keywords = ["agents", "cli", "codex", "orchestration", "llm"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
time = { version = "0.3.55", default-features = false }
