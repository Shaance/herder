name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Check jq is installed
        run: command -v jq || { echo "jq is required but not installed" >&2; exit 1; }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Render the Homebrew formula
        run: |
          dir=$(mktemp -d)
          sha=$(printf '%064d' 0)
          printf '%s  herder-macos-universal.tar.gz\n' "$sha" > "$dir/herder-macos-universal.tar.gz.sha256"
          sh packaging/homebrew/render-formula.sh 1.2.3 "$dir" > "$dir/herder.rb"
          grep -qx '  url "https://github.com/Shaance/herder/releases/download/v1.2.3/herder-macos-universal.tar.gz"' "$dir/herder.rb"
          grep -qx "  sha256 \"$sha\"" "$dir/herder.rb"
          if grep -q @ "$dir/herder.rb"; then echo "unfilled placeholder" >&2; exit 1; fi
          ruby -c "$dir/herder.rb"

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.89 --profile minimal
      - run: cargo +1.89 check --all-targets --locked

  mcp:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            mcp
      - run: cargo build --locked
      - run: command -v jq
      - run: cargo fmt --manifest-path mcp/Cargo.toml --check
      - run: cargo clippy --manifest-path mcp/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path mcp/Cargo.toml --locked
