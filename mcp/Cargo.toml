[package]
name = "herder-mcp"
version = "0.6.0"
edition = "2024"
description = "Local MCP server for Codex reviews and verified implementation with Herder"
repository = "https://github.com/Shaance/herder"
readme = "README.md"
license = "MIT OR Apache-2.0"
exclude = ["/tests"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rmcp = { version = "3.11.0", default-features = false, features = ["macros", "server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }

[dev-dependencies]
rmcp = { version = "3.11.0", default-features = false, features = ["client", "transport-child-process"] }
